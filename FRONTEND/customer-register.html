
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration - Krishi Connect</title>

    <link rel="stylesheet" href="customer-register.css">

</head>


<body>

<div class="register-container">

    <div class="register-box">

        <div class="top-section">

            <h1>Customer Registration</h1>

            <p>
                Create your Krishi Connect customer account
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    maxlength="15"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter your city/location"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>

        </form>


        <p id="message"></p>


        <p class="login-link">

            Already have an account?

            <a href="customer-login.html">
                Login here
            </a>

        </p>


        <a
            href="index.html"
            class="back-link">

            ← Go to Main Dashboard

        </a>

    </div>

</div>


<script>

const registerForm =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name")
                .value.trim();

        const mobile =
            document.getElementById("mobile")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;

        const location =
            document.getElementById("location")
                .value.trim();


        message.textContent =
            "Creating account...";

        message.style.color =
            "#267a35";


        try {

            const response =
                await fetch(
                    "http://127.0.0.1:8000/api/customers/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            mobile: mobile,

                            password: password,

                            location: location

                        })
                    }
                );


            const data =
                await response.json();


            console.log(
                "Customer registration response:",
                data
            );


            if (!response.ok) {

                message.textContent =
                    data.detail ||
                    "Registration failed.";

                message.style.color =
                    "#c62828";

                return;
            }


            message.textContent =
                "Registration successful! Redirecting to login...";

            message.style.color =
                "#267a35";


            setTimeout(function() {

                window.location.href =
                    "customer-login.html";

            }, 1000);


        }
        catch(error) {

            console.error(
                "Customer registration error:",
                error
            );


            message.textContent =
                "Cannot connect to backend.";

            message.style.color =
                "#c62828";

        }

    }
);

</script>

</body>

</html>
