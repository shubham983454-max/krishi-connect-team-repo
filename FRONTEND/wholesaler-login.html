<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wholesaler Login</title>

    <link rel="stylesheet"
          href="wholesaler-login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Wholesaler Login</h1>

        <p class="subtitle">
            Login to access your company dashboard
        </p>


        <form id="loginForm">


            <!-- COMPANY NAME -->

            <label for="companyName">
                Company Name
            </label>

            <input
                type="text"
                id="companyName"
                placeholder="Enter company name"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                id="loginButton">

                Login

            </button>


        </form>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- REGISTER -->

        <p class="register-link">

            Don't have an account?

            <a href="wholesaler-register.html">
                Register here
            </a>

        </p>


        <a href="index.html"
           class="back-link">

            ← Back to Main Dashboard

        </a>

    </div>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const companyName =
            document.getElementById(
                "companyName"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const message =
            document.getElementById("message");


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {

            const response = await fetch(

                "https://krishi-connect-team-repo.onrender.com/api/wholesalers/login",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        email: email,

                        password: password

                    })

                }

            );


            const data =
                await response.json();


            if (response.ok) {


                // Save wholesaler information

                localStorage.setItem(
                    "wholesalerId",
                    data.wholesaler_id
                );


                localStorage.setItem(
                    "wholesalerData",
                    JSON.stringify({

                        wholesaler_id:
                            data.wholesaler_id,

                        company_name:
                            data.company_name,

                        email:
                            data.email,

                        company_location:
                            data.company_location

                    })
                );


                message.textContent =
                    "Login successful!";

                message.style.color =
                    "#267a35";


                setTimeout(function() {

                    window.location.href =
                        "wholesaler-dashboard.html";

                }, 500);

            }


            else {

                message.textContent =
                    data.detail ||
                    "Invalid email or password.";

                message.style.color =
                    "#c62828";


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }

        }


        catch(error) {

            console.error(error);

            message.textContent =
                "Cannot connect to backend.";

            message.style.color =
                "#c62828";


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }

);

</script>

</body>

</html>
